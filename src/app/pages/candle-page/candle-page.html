<div id="colecao">
    <app-navbar></app-navbar>
    
    <section class="candle-page">
        <div class="container">
            <div class="page-header">
                <h1>As Nossas Velas</h1>
                <p>Deixa-te envolver pelos aromas que podem transformar a tua casa.</p>
            </div>

            <div class="products-grid">

                <div class="product-card" *ngFor="let candle of candles()" [routerLink]="['/vela', candle.id]">
                    <img [src]="candle.image" [alt]="candle.name">

                    <div class="content">
                        <h3>{{ candle.name }}</h3>
                    </div>
                </div>
            </div>   
        </div>
        

        
    </section>
</div>
